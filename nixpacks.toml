[phases.setup]
nixPkgsArchive = "master"
nixPkgs = [
  "glib",
  "file",
  "nspr",
  "nss",
  "dbus",
  "at-spi2-atk",
  "cups",
  "libdrm",
  "expat",
  "libxkbcommon",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "mesa",
  "cairo",
  "pango",
  "alsa-lib",
  "gtk3"
]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["playwright install chromium && playwright install-deps chromium"]
cacheDirectories = ["/root/.cache/ms-playwright"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright"

[start]
cmd = "python bot.py"
